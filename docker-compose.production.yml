services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set trusted frontend origin}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?set a long random API_ACCESS_TOKEN}
      PAPER_INITIAL_CAPITAL: ${PAPER_INITIAL_CAPITAL:-5000}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-10}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-10}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      BACKEND_API_TOKEN: ${API_ACCESS_TOKEN:?set API_ACCESS_TOKEN}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
  market-data-worker:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    profiles: ["market-data"]
    command: ["python", "-m", "app.market_data.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-BTC/INR}
    depends_on:
      backend:
        condition: service_healthy
  paper-monitor:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    profiles: ["paper"]
    command: ["python", "-m", "app.paper.monitor"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-10}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-10}
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
