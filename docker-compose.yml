services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_app} -d ${POSTGRES_DB:-crypto_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crypto_app:change_me_local_only@db:5432/crypto_intelligence}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      PAPER_INITIAL_CAPITAL: ${PAPER_INITIAL_CAPITAL:-5000}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-10}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-10}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  market-data-worker:
    profiles: ["market-data"]
    build: ./backend
    command: ["python", "-m", "app.market_data.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crypto_app:change_me_local_only@db:5432/crypto_intelligence}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-BTC/INR}
    depends_on:
      backend:
        condition: service_healthy
  paper-monitor:
    profiles: ["paper"]
    build: ./backend
    command: ["python", "-m", "app.paper.monitor"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crypto_app:change_me_local_only@db:5432/crypto_intelligence}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-10}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-10}
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      BACKEND_API_TOKEN: ${API_ACCESS_TOKEN:-}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
