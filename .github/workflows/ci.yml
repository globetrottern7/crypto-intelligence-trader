name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crypto_intelligence
          POSTGRES_USER: crypto_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto_app -d crypto_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
      - name: Validate Alembic migration graph
        run: alembic history
      - name: Apply migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://crypto_app:ci_test_password@localhost:5432/crypto_intelligence
        run: alembic upgrade head
      - name: Verify API readiness against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://crypto_app:ci_test_password@localhost:5432/crypto_intelligence
        run: python -c "from fastapi.testclient import TestClient; from app.main import app; response = TestClient(app).get('/ready'); assert response.status_code == 200, response.text; assert response.json()['database'] == 'connected'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
